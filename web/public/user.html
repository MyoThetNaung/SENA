<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SENA — My account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&amp;family=Open+Sans:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="user-portal">
    <canvas id="network" aria-hidden="true"></canvas>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-row">
            <img class="brand-logo" src="/sena-logo.svg" width="48" height="48" alt="" />
            <div class="brand-name audiowide-regular">SENA</div>
          </div>
          <div class="brand-tagline">My account</div>
        </div>
        <nav class="nav sidebar-nav-panel" id="mainNav">
          <button type="button" class="nav-item active" data-tab="overview">
            <img class="nav-icon" src="/nav-icons/overview.svg" width="22" height="22" alt="" />
            <span class="nav-item-label">Overview</span>
          </button>
          <button type="button" class="nav-item" data-tab="data">
            <img class="nav-icon" src="/nav-icons/memory.svg" width="22" height="22" alt="" />
            <span class="nav-item-label">Memory</span>
          </button>
          <button type="button" class="nav-item" data-tab="chat">
            <img class="nav-icon" src="/nav-icons/chat.svg" width="22" height="22" alt="" />
            <span class="nav-item-label">Chat</span>
          </button>
          <button type="button" class="nav-item" data-tab="telegram">
            <img class="nav-icon" src="/nav-icons/telegram.svg" width="22" height="22" alt="" />
            <span class="nav-item-label">Telegram</span>
          </button>
          <button type="button" class="nav-item" data-tab="access">
            <img class="nav-icon" src="/nav-icons/access.svg" width="22" height="22" alt="" />
            <span class="nav-item-label">Access</span>
          </button>
          <button type="button" class="nav-item" data-tab="calendar">
            <img class="nav-icon" src="/nav-icons/calendar.svg" width="22" height="22" alt="" />
            <span class="nav-item-label">Calendar</span>
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div class="sidebar-actions">
            <div class="sidebar-bot-power power-switch-wrap user-bot-readonly">
              <div class="sidebar-bot-power-head">
                <span class="sidebar-bot-power-title">AI assistance</span>
                <span id="sidebarBotToggleSub" class="sidebar-bot-power-state">…</span>
              </div>
            </div>
            <button type="button" id="btnUserLogout" class="btn-mini ghost sidebar-logout-btn">Sign out</button>
          </div>
        </div>
      </aside>
      <main class="main">
        <p id="status" class="statusbar" aria-live="polite"></p>

        <section class="tab-panel active" id="panel-overview">
          <h1><span>Overview</span></h1>
          <div class="overview-status-grid user-overview-grid">
            <div class="status-card" id="overviewCardBotName">
              <div class="status-card-label">I am</div>
              <div id="overviewBotName" class="status-card-value status-card-value-name">…</div>
            </div>
            <div class="status-card" id="overviewCardTelegram">
              <div class="status-card-head">
                <span class="status-card-label">AI assistance</span>
                <span id="overviewTelegramLed" class="status-led" aria-hidden="true"></span>
              </div>
              <div id="overviewTelegramLine" class="status-card-value">…</div>
            </div>
            <div class="status-card" id="overviewCardClock">
              <div class="status-card-label">Panel time</div>
              <div id="overviewClockLine" class="status-card-value overview-clock-line">…</div>
              <div id="overviewClockTz" class="status-card-sub"></div>
            </div>
          </div>
        </section>

        <section class="tab-panel" id="panel-data">
          <h1><span>My memory</span></h1>
          <div class="card mem-user-card">
            <div class="mem-timezone-wrap">
              <label for="memUserTimezone">Your timezone</label>
              <select id="memUserTimezone" class="chat-session-select"></select>
            </div>
            <div class="mem-grid">
              <div>
                <label>Display name</label>
                <input type="text" id="memDisplayName" />
              </div>
              <div>
                <label>Gender</label>
                <select id="memGender">
                  <option value="">—</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="mem-span2">
                <label>Who I am</label>
                <textarea id="memWhoAmI" rows="2"></textarea>
              </div>
              <div class="mem-span2">
                <label>Other notes</label>
                <textarea id="memExtra" rows="2"></textarea>
              </div>
              <div class="mem-span2">
                <label>Conversation memory</label>
                <textarea id="memMemorySummary" rows="6"></textarea>
              </div>
            </div>
            <div class="mem-actions">
              <button type="button" id="btnSaveMem" class="success">Save memory</button>
            </div>
          </div>
          <div class="card">
            <h2>My saved rows</h2>
            <button type="button" id="btnRefreshRecords" class="primary ghost">Refresh</button>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Id</th>
                    <th>Type</th>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Notes</th>
                  </tr>
                </thead>
                <tbody id="recordsBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="tab-panel" id="panel-chat">
          <h1><span>Chat</span></h1>
          <div class="card chat-console">
            <div class="toolbar chat-toolbar">
              <label for="chatLimit">History</label>
              <select id="chatLimit">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="200">200</option>
              </select>
              <button type="button" id="btnRefreshChat" class="primary ghost">Refresh</button>
              <button type="button" id="btnClearChat" class="danger ghost">Clear my chat</button>
            </div>
            <div class="chat-messenger">
              <div id="chatThread" class="chat-thread chat-messenger-thread" aria-live="polite"></div>
              <div class="chat-messenger-compose">
                <div class="chat-messenger-input-place">
                  <textarea id="chatInput" class="chat-messenger-input" rows="2" placeholder="Message…"></textarea>
                  <button type="button" id="btnChatSend" class="chat-messenger-send" aria-label="Send">Send</button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="tab-panel" id="panel-telegram">
          <h1><span>My Telegram</span></h1>
          <div class="card" id="telegramCard">
            <p class="hint">Your linked Telegram account for this assistant.</p>
            <dl class="user-detail-list" id="telegramDetails"></dl>
          </div>
        </section>

        <section class="tab-panel" id="panel-access">
          <h1><span>My access</span></h1>
          <div class="card">
            <p class="hint">Your invitation status on this assistant.</p>
            <dl class="user-detail-list" id="accessDetails"></dl>
          </div>
        </section>

        <section class="tab-panel" id="panel-calendar">
          <h1><span>My calendar</span></h1>
          <div class="card">
            <button type="button" id="btnRefreshCalendar" class="primary ghost">Refresh</button>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>When</th>
                    <th>Title</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="calendarBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/user-app.js"></script>
  </body>
</html>
